name: Deploy game to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - ".github/extensions/monas-octoverse-arcade-starter/game.html"
      - ".github/workflows/pages.yml"
      - "docs/screenshots/after-title.png"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Build site from the canvas game
        run: |
          mkdir -p _site
          cp .github/extensions/monas-octoverse-arcade-starter/game.html _site/index.html
          cp docs/screenshots/after-title.png _site/og.png
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
