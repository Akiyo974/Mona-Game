<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mona's Octoverse Arcade - Fort Mason Octodex</title>
  <link rel="icon" href="data:,">
  <style>
    :root { color-scheme: dark; font: 16px/1.5 system-ui, sans-serif; background: #0d1117; color: #e6edf3; }
    * { box-sizing: border-box; }
    body { display: grid; min-height: 100vh; margin: 0; place-items: center; padding: 0.75rem; }
    main { width: min(100%, 44rem); padding: 0.75rem; background: #161b22; border: 1px solid #30363d; border-radius: 1rem; }
    .top { display: flex; align-items: center; justify-content: space-between; gap: 0.5rem; margin-bottom: 0.5rem; }
    .eyebrow { margin: 0; color: #3fb950; font-size: 0.7rem; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; }
    h1 { margin: 0; font-size: clamp(1.1rem, 4vw, 1.5rem); line-height: 1.2; }
    .count { font-weight: 700; white-space: nowrap; }
    .stage { position: relative; }
    canvas#game { display: block; width: 100%; height: auto; background: #0d1117; border: 2px solid #30363d; border-radius: 0.5rem; image-rendering: pixelated; }
    #toast { position: absolute; left: 50%; bottom: 0.75rem; max-width: 90%; padding: 0.4rem 0.9rem; transform: translateX(-50%); color: #fff; font-weight: 700; text-align: center; background: rgba(35,134,54,.95); border-radius: 999px; pointer-events: none; opacity: 0; transition: opacity .25s; }
    #toast.show { opacity: 1; }
    .overlay { position: absolute; inset: 0; display: flex; flex-direction: column; gap: 0.5rem; padding: 0.75rem; overflow: auto; background: rgba(13,17,23,.95); border-radius: 0.5rem; }
    .overlay[hidden] { display: none; }
    .overlay header { display: flex; align-items: center; justify-content: space-between; gap: 0.5rem; }
    .overlay h2 { margin: 0; font-size: 1.2rem; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(5.5rem, 1fr)); gap: 0.5rem; }
    .card { display: flex; flex-direction: column; align-items: center; gap: 0.2rem; padding: 0.4rem; color: inherit; font: inherit; font-size: 0.75rem; text-align: center; background: #161b22; border: 2px solid #30363d; border-radius: 0.5rem; cursor: pointer; }
    .card.found { border-color: #3fb950; }
    .card.locked { opacity: .55; }
    .card.selected { box-shadow: 0 0 0 2px #58a6ff; }
    .card canvas { width: 64px; height: 64px; image-rendering: pixelated; }
    .card .q { display: grid; width: 64px; height: 64px; place-items: center; color: #6e7681; font-size: 2rem; font-weight: 700; }
    #detail { min-height: 3rem; margin: 0; padding: 0.5rem 0.75rem; color: #c9d1d9; font-size: 0.9rem; background: #161b22; border: 1px solid #30363d; border-radius: 0.5rem; }
    button { padding: 0.45rem 0.9rem; color: #fff; font: inherit; font-size: 0.9rem; font-weight: 700; background: #238636; border: 0; border-radius: 0.5rem; cursor: pointer; }
    button:hover { background: #1a7f37; }
    button.secondary { background: #30363d; }
    button.secondary:hover { background: #3d444d; }
    button:focus-visible, .card:focus-visible { outline: 3px solid #58a6ff; outline-offset: 2px; }
    .card .mv { color: #8b949e; font-size: 0.65rem; }
    #battleUI { position: absolute; left: 0.5rem; right: 0.5rem; bottom: 0.5rem; display: flex; flex-direction: column; gap: 0.4rem; padding: 0.5rem 0.75rem; background: rgba(13,17,23,.93); border: 2px solid #30363d; border-radius: 0.5rem; }
    #battleUI[hidden] { display: none; }
    #battleMsg { margin: 0; min-height: 1.5rem; font-weight: 700; }
    #battleUI .row { display: flex; gap: 0.5rem; }
    button:disabled { opacity: .5; cursor: default; }
    .help { margin: 0.5rem 0 0; color: #8b949e; font-size: 0.8rem; }
    kbd { padding: 0 0.3rem; background: #0d1117; border: 1px solid #30363d; border-radius: 0.25rem; font-size: 0.75rem; }
  </style>
</head>
<body>
  <main>
    <div class="top">
      <div>
        <p class="eyebrow">Mona's Octoverse Arcade</p>
        <h1>Fort Mason Octodex</h1>
      </div>
      <div><span class="count">Octocats: <span id="count">0</span>/<span id="total">0</span></span> <button id="invBtn" type="button" class="secondary">Inventory (I)</button> <button id="muteBtn" type="button" class="secondary">Music: On (M)</button></div>
    </div>
    <div class="stage">
      <canvas id="game" width="640" height="448" tabindex="0" aria-label="Fort Mason map"></canvas>
      <div id="toast" role="status" aria-live="polite"></div>
      <section class="overlay" id="pick" hidden aria-label="Choose your Octocat">
        <header><h2 id="pickTitle">Choose your Octocat</h2><button id="pickRun" type="button" class="secondary">Run (Esc)</button></header>
        <div class="grid" id="pickGrid"></div>
      </section>
      <div id="battleUI" hidden>
        <p id="battleMsg" role="status" aria-live="polite"></p>
        <div class="row"><button id="fightBtn" type="button">Fight</button><button id="runBtn" type="button" class="secondary">Run (Esc)</button></div>
      </div>
      <section class="overlay" id="inv" hidden aria-label="Inventory">
        <header><h2>Octodex <span id="invCount"></span></h2><button id="closeInv" type="button">Close (I)</button></header>
        <div class="grid" id="grid"></div>
        <p id="detail">Select an Octocat to see where you found it.</p>
        <div><button id="resetBtn" type="button" class="secondary">Reset progress</button></div>
      </section>
    </div>
    <p class="help">Move with <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> (or arrow keys). Walk into an Octocat to collect it. <kbd>I</kbd> opens the inventory, <kbd>M</kbd> toggles music (it starts on your first key press or click).</p>
  </main>
  <script>
    // Drop in your own art here: paths/URLs relative to this page. Leave null to use the built-in placeholders.
    const ASSETS = {
      player: null,
      octocats: {} // e.g. { octocat: "assets/octocat.png" }
    };

    const TS = 32, MW = 48, MH = 34, VW = 640, VH = 448;
    const cv = document.getElementById("game"), ctx = cv.getContext("2d");
    const $ = (id) => document.getElementById(id);

    /* ---------- Map: a stylised Fort Mason, San Francisco ---------- */
    const SOLID = new Set(["~", "B", "T"]);
    const grid = Array.from({ length: MH }, () => Array(MW).fill("."));
    function rect(x, y, w, h, ch) { for (let j = y; j < y + h; j++) for (let i = x; i < x + w; i++) if (grid[j] && i >= 0 && i < MW) grid[j][i] = ch; }

    const OCTOCATS = [
      { id: "octocat",     name: "Octocat",       tx: 7,  ty: 2,  color: "#6e5494", where: "Out on Pier 1, at the edge of the bay." },
      { id: "mona",        name: "Mona",          tx: 19, ty: 2,  color: "#3fb950", where: "At the tip of Pier 2." },
      { id: "dinotocat",   name: "Dinotocat",     tx: 31, ty: 7,  color: "#7ee787", where: "Hiding behind the Pier 3 shed." },
      { id: "daftpunkcat", name: "Daftpunkcat",   tx: 2,  ty: 12, color: "#d2a8ff", where: "Next to Laguna Street, by Fort Mason Center." },
      { id: "jetpacktocat",name: "Jetpacktocat",  tx: 12, ty: 16, color: "#58a6ff", where: "On the west side of the Great Meadow." },
      { id: "spidertocat", name: "Spidertocat",   tx: 35, ty: 16, color: "#f85149", where: "East of the Great Meadow paths." },
      { id: "scottocat",   name: "Scottocat",     tx: 6,  ty: 21, color: "#ffa657", where: "Under the trees on Fort Mason hill." },
      { id: "heisencat",   name: "Heisencat",     tx: 40, ty: 21, color: "#e3b341", where: "Along the eastern lawn above Gashouse Cove." },
      { id: "privateer",   name: "Privateer",     tx: 15, ty: 29, color: "#79c0ff", where: "Deep in the southern grove." },
      { id: "nyantocat",   name: "Nyantocat",     tx: 30, ty: 30, color: "#ff7b72", where: "Near the south hillside." },
      { id: "chellocat",   name: "Chellocat",     tx: 41, ty: 9,  color: "#56d364", where: "On the bay promenade near the Marina." },
      { id: "defunktocat", name: "Defunktocat",   tx: 23, ty: 25, color: "#a371f7", where: "At the south end of the Great Meadow path." }
    ];
    const SPAWN = { tx: 23, ty: 9 };

    function buildMap() {
      rect(0, 0, MW, 8, "~");                       // San Francisco Bay
      for (const px of [5, 17, 29]) {               // Piers 1-3
        rect(px, 2, 6, 6, "P");
        rect(px + 1, 3, 4, 3, "B");                 // pier sheds
      }
      rect(0, 8, MW, 2, "=");                       // bay promenade
      rect(42, 8, 6, 14, "~");                      // Gashouse Cove
      rect(40, 15, 5, 1, "P");                      // dock
      rect(0, 10, 2, 24, "#");                      // Laguna Street
      rect(3, 11, 8, 3, "B"); rect(13, 11, 5, 3, "B");   // Fort Mason Center
      rect(30, 11, 6, 3, "B"); rect(37, 11, 3, 3, "B");  // Herbst Pavilion & friends
      rect(23, 10, 2, 17, "=");                     // Great Meadow N-S path
      rect(2, 20, 40, 1, "=");                      // E-W path
      for (let i = 0; i < 9; i++) { grid[15 + i][14 + i] = "="; grid[15 + i][33 - i] = "="; } // diagonals
      // Fort Mason hill / grove: deterministic scatter of trees clear of paths and Octocats
      let seed = 1337;
      const rnd = () => (seed = (seed * 1664525 + 1013904223) >>> 0) / 4294967296;
      for (let y = 22; y < MH; y++) for (let x = 2; x < 46; x++) {
        const nearCat = OCTOCATS.some((c) => Math.abs(c.tx - x) <= 1 && Math.abs(c.ty - y) <= 1);
        if (grid[y][x] === "." && !nearCat && rnd() < 0.14) grid[y][x] = "T";
      }
      rect(0, MH - 1, MW, 1, "T");
    }
    buildMap();

    const solidAt = (tx, ty) => tx < 0 || ty < 0 || tx >= MW || ty >= MH || SOLID.has(grid[ty][tx]);
    const hash = (x, y, n) => { let h = (x * 374761393 + y * 668265263 + n * 2147483647) >>> 0; h = (h ^ (h >>> 13)) * 1274126177 >>> 0; return (h ^ (h >>> 16)) / 4294967296; };

    /* ---------- Static map layer (drawn once) ---------- */
    const mapCv = document.createElement("canvas"); mapCv.width = MW * TS; mapCv.height = MH * TS;
    function renderMap() {
      const m = mapCv.getContext("2d");
      for (let y = 0; y < MH; y++) for (let x = 0; x < MW; x++) {
        const t = grid[y][x], px = x * TS, py = y * TS, r = hash(x, y, 1);
        if (t === "~") {
          m.fillStyle = r < 0.5 ? "#1f6fb2" : "#1b66a6"; m.fillRect(px, py, TS, TS);
          m.strokeStyle = "rgba(255,255,255,.25)"; m.lineWidth = 2; m.beginPath();
          m.moveTo(px + 4, py + 10 + r * 10); m.quadraticCurveTo(px + 10, py + 5 + r * 10, px + 16, py + 10 + r * 10); m.quadraticCurveTo(px + 22, py + 15 + r * 10, px + 28, py + 10 + r * 10); m.stroke();
        } else if (t === "P") {
          m.fillStyle = "#a9794b"; m.fillRect(px, py, TS, TS);
          m.strokeStyle = "#7a5230"; m.lineWidth = 1;
          for (let k = 0; k < TS; k += 8) { m.beginPath(); m.moveTo(px, py + k + .5); m.lineTo(px + TS, py + k + .5); m.stroke(); }
        } else if (t === "=") {
          m.fillStyle = "#d9c58f"; m.fillRect(px, py, TS, TS);
          m.fillStyle = "rgba(120,100,50,.25)"; m.fillRect(px + r * 24, py + hash(x, y, 2) * 24, 4, 3);
        } else if (t === "#") {
          m.fillStyle = "#5b6068"; m.fillRect(px, py, TS, TS);
          if (x === 0 && y % 2 === 0) { m.fillStyle = "#e3b341"; m.fillRect(px + 14, py + 4, 4, 18); }
        } else {
          m.fillStyle = y > 21 ? "#3f8f4a" : "#58b45a"; m.fillRect(px, py, TS, TS); // hill is slightly darker
          m.fillStyle = "rgba(255,255,255,.12)";
          for (let k = 0; k < 3; k++) m.fillRect(px + hash(x, y, 10 + k) * 28, py + hash(x, y, 20 + k) * 28, 2, 4);
          if (t === "T") {
            m.fillStyle = "#6b4423"; m.fillRect(px + 13, py + 18, 6, 12);
            m.fillStyle = "#1f6f35"; m.beginPath(); m.arc(px + 16, py + 14, 13, 0, 7); m.fill();
            m.fillStyle = "#2f8f46"; m.beginPath(); m.arc(px + 12, py + 11, 6, 0, 7); m.fill();
          }
        }
        if (t === "B") {
          const shed = x >= 5 && y < 8 && (x < 11 || (x >= 17 && x < 23) || x >= 29);
          m.fillStyle = shed ? "#8b949e" : "#c0583f"; m.fillRect(px, py, TS, TS);
          m.fillStyle = shed ? "#6e7681" : "#8e3a28"; m.fillRect(px, py, TS, 6);
          m.fillStyle = "rgba(0,0,0,.25)"; m.fillRect(px + 6, py + 14, 8, 10); m.fillRect(px + 18, py + 14, 8, 10);
        }
      }
      m.font = "bold 13px system-ui"; m.textAlign = "center"; m.textBaseline = "middle";
      const label = (s, x, y, c) => { m.lineWidth = 3; m.strokeStyle = "rgba(0,0,0,.65)"; m.strokeText(s, x * TS, y * TS); m.fillStyle = c || "#fff"; m.fillText(s, x * TS, y * TS); };
      label("SAN FRANCISCO BAY", 24, 0.8, "#cfe8ff");
      label("Pier 1", 8, 6.8); label("Pier 2", 20, 6.8); label("Pier 3", 32, 6.8);
      label("Fort Mason Center", 7, 12.5); label("Herbst Pavilion", 33, 12.5);
      label("Great Meadow", 24, 18.2); label("Gashouse Cove", 45, 11); label("Fort Mason Hill", 24, 27.2);
      m.save(); m.translate(0.5 * TS + 6, 22 * TS); m.rotate(-Math.PI / 2); label("Laguna St", 0, 0); m.restore();
    }
    renderMap();

    /* ---------- State ---------- */
    let collected = new Set(), moves = {}, keys = {}, last = 0, toastT = 0, selected = null, time = 0;
    let scene = "world", battle = null, encounterCd = 0, pendingFoe = null;
    const player = { x: SPAWN.tx * TS + TS / 2, y: SPAWN.ty * TS + TS / 2, dir: "down", moving: false, w: 20, h: 12, speed: 150 };
    const MOVES = [
      { name: "Commit Strike", acc: 100 }, { name: "Merge Slam", acc: 90 }, { name: "Pull Request Punch", acc: 85 },
      { name: "Branch Slash", acc: 95 }, { name: "Rebase Rush", acc: 80 }, { name: "Stash Smash", acc: 90 },
      { name: "Force Push", acc: 70 }, { name: "Fork Bomb", acc: 60 }
    ];
    const moveOf = (id) => MOVES.find((m) => m.name === moves[id]) || MOVES[0];
    function rollMoves() { for (const c of OCTOCATS) moves[c.id] = MOVES[Math.floor(Math.random() * MOVES.length)].name; }
    rollMoves();
    const save = () => {}; // progress is not persisted: every load starts with 0 Octocats

    const images = {};
    function loadImg(key, src) { if (!src) return; const im = new Image(); im.onload = () => { images[key] = im; }; im.src = src; }
    loadImg("player", ASSETS.player);
    for (const [id, src] of Object.entries(ASSETS.octocats)) loadImg(id, src);

    /* ---------- Sprites (placeholders) ---------- */
    function drawOctocat(c, x, y, s, color, t, img) {
      if (img) { c.drawImage(img, x - s / 2, y - s / 2, s, s); return; }
      const b = Math.sin(t * 4) * s * 0.03;
      c.save(); c.translate(x, y + b);
      c.strokeStyle = color; c.lineWidth = s * 0.09; c.lineCap = "round";
      for (let i = -2; i <= 2; i++) { c.beginPath(); c.moveTo(i * s * 0.12, s * 0.2); c.quadraticCurveTo(i * s * 0.2, s * 0.42, i * s * 0.28 + Math.sin(t * 3 + i) * s * 0.04, s * 0.46); c.stroke(); }
      c.fillStyle = color; c.beginPath(); c.arc(0, 0, s * 0.34, 0, 7); c.fill();
      c.beginPath(); c.moveTo(-s * 0.32, -s * 0.12); c.lineTo(-s * 0.3, -s * 0.46); c.lineTo(-s * 0.08, -s * 0.3); c.fill();
      c.beginPath(); c.moveTo(s * 0.32, -s * 0.12); c.lineTo(s * 0.3, -s * 0.46); c.lineTo(s * 0.08, -s * 0.3); c.fill();
      c.fillStyle = "#fff"; c.beginPath(); c.arc(-s * 0.13, -s * 0.03, s * 0.08, 0, 7); c.arc(s * 0.13, -s * 0.03, s * 0.08, 0, 7); c.fill();
      c.fillStyle = "#0d1117"; c.beginPath(); c.arc(-s * 0.13, -s * 0.03, s * 0.04, 0, 7); c.arc(s * 0.13, -s * 0.03, s * 0.04, 0, 7); c.fill();
      c.restore();
    }
    function drawPlayer(c, x, y, t) {
      if (images.player) { c.drawImage(images.player, x - 16, y - 28, 32, 32); return; }
      const step = player.moving ? Math.sin(t * 14) * 3 : 0, d = player.dir;
      c.fillStyle = "rgba(0,0,0,.3)"; c.beginPath(); c.ellipse(x, y + 2, 11, 5, 0, 0, 7); c.fill();
      c.fillStyle = "#30363d"; c.fillRect(x - 7, y - 8 + (step > 0 ? 0 : 0), 6, 9 - Math.max(0, step)); c.fillRect(x + 1, y - 8, 6, 9 + Math.min(0, step));
      c.fillStyle = "#1f6feb"; c.fillRect(x - 9, y - 22, 18, 15);          // shirt
      c.fillStyle = "#f2c9a0"; c.beginPath(); c.arc(x, y - 27, 8, 0, 7); c.fill(); // head
      c.fillStyle = "#da3633"; c.beginPath(); c.arc(x, y - 29, 8.5, Math.PI, 0); c.fill(); // cap
      if (d === "up") { c.fillStyle = "#da3633"; c.fillRect(x - 8.5, y - 30, 17, 4); }
      else {
        c.fillStyle = "#da3633"; c.fillRect(x - 8.5, y - 30, 17, 2);
        c.fillStyle = "#0d1117";
        if (d === "down") { c.fillRect(x - 4, y - 27, 2, 3); c.fillRect(x + 2, y - 27, 2, 3); }
        else { const o = d === "left" ? -1 : 1; c.fillRect(x + o * 4 - 1, y - 27, 2, 3); c.fillStyle = "#da3633"; c.fillRect(x + (o > 0 ? 6 : -14), y - 29, 8, 2); }
      }
    }

    /* ---------- Music: 8-bit chiptune synth (Web Audio, no audio files) ---------- */
    const Music = (() => {
      let ac = null, master = null, analyser = null, noiseBuf = null, muted = false, wanted = "world", cur = null;
      const waves = {}, mtof = (n) => 440 * Math.pow(2, (n - 69) / 12);
      const LEN = 128; // 8 bars of 16 steps

      function init() {
        if (ac) return;
        ac = new (window.AudioContext || window.webkitAudioContext)();
        const comp = ac.createDynamicsCompressor(); master = ac.createGain(); master.gain.value = muted ? 0 : 0.5;
        analyser = ac.createAnalyser(); analyser.fftSize = 1024;
        master.connect(comp); comp.connect(analyser); comp.connect(ac.destination);
        noiseBuf = ac.createBuffer(1, ac.sampleRate, ac.sampleRate);
        const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
      }
      function pulse(duty) {
        if (!waves[duty]) {
          const N = 32, re = new Float32Array(N), im = new Float32Array(N);
          for (let n = 1; n < N; n++) re[n] = (2 / (n * Math.PI)) * Math.sin(n * Math.PI * duty);
          waves[duty] = ac.createPeriodicWave(re, im);
        }
        return waves[duty];
      }
      function tone(bus, type, freq, t, dur, vol, o = {}) {
        const osc = ac.createOscillator(), g = ac.createGain();
        if (typeof type === "number") osc.setPeriodicWave(pulse(type)); else osc.type = type;
        osc.frequency.setValueAtTime(freq, t);
        if (o.to) osc.frequency.exponentialRampToValueAtTime(o.to, t + dur);
        g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(vol, t + 0.006);
        if (o.sus) g.gain.setValueAtTime(vol, t + dur * 0.7);
        g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
        osc.connect(g); g.connect(bus); osc.start(t); osc.stop(t + dur + 0.02);
      }
      function noise(bus, t, dur, vol, ftype, freq) {
        const src = ac.createBufferSource(), f = ac.createBiquadFilter(), g = ac.createGain();
        src.buffer = noiseBuf; f.type = ftype; f.frequency.value = freq;
        g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
        src.connect(f); f.connect(g); g.connect(bus); src.start(t, Math.random() * 0.5); src.stop(t + dur + 0.02);
      }
      const kick = (b, t, v) => tone(b, "triangle", 160, t, 0.16, v, { to: 40 });
      const snare = (b, t, v) => { noise(b, t, 0.13, v, "bandpass", 1800); tone(b, "triangle", 230, t, 0.08, v * 0.7, { to: 110 }); };
      const hat = (b, t, v, open) => noise(b, t, open ? 0.1 : 0.03, v, "highpass", 7000);

      // Relaxed house, ~118 BPM: F  Em  Dm  Am | F  Em  Dm  G7
      const W_CH = [[53, 57, 60, 64], [52, 55, 59, 62], [50, 53, 57, 60], [57, 60, 64, 67], [53, 57, 60, 64], [52, 55, 59, 62], [50, 53, 57, 60], [55, 59, 62, 65]];
      const W_ROOT = [41, 40, 38, 33, 41, 40, 38, 43];
      const W_MEL = [
        [[0, 76, 3], [4, 72, 2], [6, 77, 2], [8, 76, 4], [12, 72, 4]],
        [[0, 76, 2], [2, 79, 2], [4, 76, 4], [8, 74, 2], [10, 71, 2], [12, 67, 4]],
        [[0, 74, 3], [4, 72, 2], [6, 69, 2], [8, 74, 4], [12, 77, 2], [14, 76, 2]],
        [[0, 72, 4], [4, 76, 2], [6, 79, 2], [8, 81, 6], [14, 79, 2]],
        [[0, 77, 3], [4, 76, 2], [6, 72, 2], [8, 69, 4], [12, 72, 4]],
        [[0, 71, 2], [2, 74, 2], [4, 76, 4], [8, 79, 4], [12, 76, 2], [14, 74, 2]],
        [[0, 74, 2], [2, 77, 2], [4, 81, 4], [8, 77, 2], [10, 74, 2], [12, 72, 4]],
        [[0, 71, 2], [2, 74, 2], [4, 77, 2], [6, 74, 2], [8, 71, 6], [14, 67, 2]]
      ];
      function playWorld(s, t, d, bus) {
        const bar = s >> 4, st = s & 15, ch = W_CH[bar], ro = W_ROOT[bar];
        if (st % 4 === 0) kick(bus, t, 0.55);
        if (st % 4 === 2) hat(bus, t, 0.11, true);
        if (st % 2 === 1) hat(bus, t, 0.035, false);
        if (st === 4 || st === 12) snare(bus, t, 0.13);
        if (st === 2 || st === 6 || st === 10) tone(bus, 0.25, mtof(ro + 12), t, d * 1.8, 0.14);
        if (st === 14) tone(bus, 0.25, mtof(ro + 19), t, d * 1.8, 0.12);
        if (st === 3 || st === 6 || st === 11) for (const n of ch) tone(bus, 0.125, mtof(n + 12), t, d * 1.5, 0.03);
        tone(bus, 0.25, mtof(ch[st % 4] + 12), t, d * 0.9, 0.028);
        for (const [at, n, len] of W_MEL[bar]) if (at === st) {
          tone(bus, 0.25, mtof(n), t, len * d, 0.07, { sus: 1 });
          tone(bus, 0.25, mtof(n), t + 3 * d, len * d, 0.026, { sus: 1 }); // echo
        }
      }

      // Intense battle, ~168 BPM: Am  Am  F  G | Am  Am  F  E
      const B_CH = [[57, 60, 64, 69], [57, 60, 64, 69], [53, 57, 60, 65], [55, 59, 62, 67], [57, 60, 64, 69], [57, 60, 64, 69], [53, 57, 60, 65], [52, 56, 59, 64]];
      const B_ROOT = [45, 45, 41, 43, 45, 45, 41, 40];
      const B_PAT = [0, 0, 12, 0, 0, 0, 12, 0, 0, 0, 12, 0, 0, 12, 0, 12];
      const B_MEL = [
        [[0, 81, 3], [3, 79, 1], [4, 76, 2], [6, 79, 2], [8, 81, 4], [12, 83, 2], [14, 84, 2]],
        [[0, 81, 6], [6, 79, 2], [8, 76, 4], [12, 72, 2], [14, 76, 2]],
        [[0, 77, 3], [3, 76, 1], [4, 72, 2], [6, 77, 2], [8, 81, 4], [12, 79, 2], [14, 77, 2]],
        [[0, 79, 3], [3, 77, 1], [4, 74, 2], [6, 79, 2], [8, 83, 4], [12, 81, 2], [14, 79, 2]],
        [[0, 81, 2], [2, 84, 2], [4, 83, 2], [6, 81, 2], [8, 79, 2], [10, 81, 2], [12, 76, 4]],
        [[0, 84, 3], [3, 83, 1], [4, 81, 4], [8, 76, 2], [10, 79, 2], [12, 81, 4]],
        [[0, 84, 2], [2, 81, 2], [4, 77, 2], [6, 81, 2], [8, 84, 4], [12, 86, 4]],
        [[0, 83, 2], [2, 80, 2], [4, 83, 2], [6, 80, 2], [8, 76, 2], [10, 80, 2], [12, 83, 4]]
      ];
      function playBattle(s, t, d, bus) {
        const bar = s >> 4, st = s & 15, ch = B_CH[bar], ro = B_ROOT[bar];
        if (st === 0 || st === 4 || st === 8 || st === 10 || st === 12) kick(bus, t, 0.6);
        if (st === 4 || st === 12 || (bar === 7 && st >= 12)) snare(bus, t, 0.17);
        if (st % 2 === 0) hat(bus, t, 0.06, false);
        if (st === 14) hat(bus, t, 0.09, true);
        tone(bus, 0.5, mtof(ro + B_PAT[st]), t, d * 0.9, 0.13);
        const arp = ch.concat(ch.map((n) => n + 12));
        tone(bus, 0.125, mtof(arp[st % 8] + 12), t, d * 0.8, 0.04);
        for (const [at, n, len] of B_MEL[bar]) if (at === st) {
          tone(bus, 0.25, mtof(n), t, len * d, 0.085, { sus: 1 });
          tone(bus, 0.5, mtof(n - 12), t, len * d, 0.03, { sus: 1 });
        }
      }
      const TRACKS = { world: { bpm: 118, play: playWorld }, battle: { bpm: 168, play: playBattle } };

      function tick(inst) {
        while (inst.nextT < ac.currentTime + 0.2) {
          inst.tr.play(inst.step % LEN, inst.nextT, inst.d, inst.bus);
          inst.step++; inst.nextT += inst.d;
        }
      }
      function stopInst(inst) {
        if (!inst) return;
        clearInterval(inst.timer);
        inst.bus.gain.cancelScheduledValues(ac.currentTime); inst.bus.gain.setValueAtTime(inst.bus.gain.value, ac.currentTime);
        inst.bus.gain.linearRampToValueAtTime(0, ac.currentTime + 0.35);
        setTimeout(() => inst.bus.disconnect(), 700);
      }
      function startInst(name) {
        const tr = TRACKS[name], bus = ac.createGain();
        bus.gain.setValueAtTime(0, ac.currentTime); bus.gain.linearRampToValueAtTime(1, ac.currentTime + 0.4); bus.connect(master);
        const inst = { name, tr, bus, step: 0, nextT: ac.currentTime + 0.08, d: 60 / tr.bpm / 4 };
        inst.timer = setInterval(() => tick(inst), 40); tick(inst); cur = inst;
      }
      function play(name) {
        wanted = name;
        if (!ac || ac.state !== "running") return;
        if (cur && cur.name === name) return;
        stopInst(cur); cur = null;
        if (name) startInst(name);
      }
      function unlock() {
        init();
        const go = () => play(wanted);
        if (ac.state === "running") go(); else ac.resume().then(go).catch(() => {});
      }
      function sfx(name) {
        if (!ac || ac.state !== "running") return;
        const t = ac.currentTime + 0.01;
        if (name === "hit") { noise(master, t, 0.2, 0.3, "bandpass", 900); tone(master, "square", 700, t, 0.25, 0.18, { to: 90 }); }
        else if (name === "miss") tone(master, "triangle", 320, t, 0.3, 0.25, { to: 110 });
        else if (name === "collect") [72, 76, 79, 84].forEach((n, i) => tone(master, 0.25, mtof(n), t + i * 0.07, 0.18, 0.12));
        else if (name === "win") [[72, 0], [72, 0.11], [72, 0.22], [76, 0.33], [79, 0.5], [84, 0.7]].forEach(([n, o]) => { tone(master, 0.25, mtof(n), t + o, 0.28, 0.12); tone(master, 0.5, mtof(n - 12), t + o, 0.28, 0.07); });
      }
      function toggleMute() {
        muted = !muted;
        if (master) master.gain.setTargetAtTime(muted ? 0 : 0.5, ac.currentTime, 0.04);
        $("muteBtn").textContent = muted ? "Music: Off (M)" : "Music: On (M)";
      }
      function peak() { const a = new Float32Array(analyser.fftSize); analyser.getFloatTimeDomainData(a); return Math.max(...a.map(Math.abs)); }
      return { play, unlock, sfx, toggleMute, peak, get info() { return { ctx: ac && ac.state, track: cur && cur.name, step: cur && cur.step, muted }; } };
    })();
    $("muteBtn").addEventListener("click", () => { Music.unlock(); Music.toggleMute(); });
    for (const ev of ["pointerdown", "keydown"]) addEventListener(ev, () => Music.unlock(), { capture: true });

    /* ---------- Movement & collection ---------- */
    function blocked(px, py) {
      const x0 = Math.floor((px - player.w / 2) / TS), x1 = Math.floor((px + player.w / 2 - 0.01) / TS);
      const y0 = Math.floor((py - player.h) / TS), y1 = Math.floor((py - 0.01) / TS);
      for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) if (solidAt(x, y)) return true;
      return false;
    }
    function toast(msg) { const el = $("toast"); el.textContent = msg; el.classList.add("show"); toastT = 2.2; }
    function collect(c) {
      collected.add(c.id); save(); updateCount();
      toast(collected.size === OCTOCATS.length ? "You caught them all! Open your inventory (I)." : "Collected " + c.name + "!");
      if (!$("inv").hidden) renderInventory();
    }
    function update(dt) {
      let dx = (keys.d || keys.ArrowRight ? 1 : 0) - (keys.a || keys.ArrowLeft ? 1 : 0);
      let dy = (keys.s || keys.ArrowDown ? 1 : 0) - (keys.w || keys.ArrowUp ? 1 : 0);
      player.moving = !!(dx || dy);
      if (player.moving) {
        if (Math.abs(dx) >= Math.abs(dy) && dx) player.dir = dx > 0 ? "right" : "left"; else player.dir = dy > 0 ? "down" : "up";
        const n = Math.hypot(dx, dy), step = player.speed * dt;
        const nx = player.x + dx / n * step, ny = player.y + dy / n * step;
        if (!blocked(nx, player.y)) player.x = nx;
        if (!blocked(player.x, ny)) player.y = ny;
      }
      if (encounterCd > 0) encounterCd -= dt;
      else for (const c of OCTOCATS) {
        if (collected.has(c.id)) continue;
        if (Math.hypot(player.x - (c.tx * TS + TS / 2), (player.y - 8) - (c.ty * TS + TS / 2)) < 22) {
          if (collected.size === 0) { collect(c); Music.sfx("collect"); } // the first Octocat is free
          else startPick(c);
          break;
        }
      }
      if (toastT > 0 && (toastT -= dt) <= 0) $("toast").classList.remove("show");
    }

    /* ---------- Rendering ---------- */
    function render() {
      const camX = Math.max(0, Math.min(MW * TS - VW, player.x - VW / 2));
      const camY = Math.max(0, Math.min(MH * TS - VH, player.y - VH / 2));
      ctx.drawImage(mapCv, Math.round(camX), Math.round(camY), VW, VH, 0, 0, VW, VH);
      ctx.save(); ctx.translate(-Math.round(camX), -Math.round(camY));
      for (const c of OCTOCATS) {
        if (collected.has(c.id)) continue;
        const cx = c.tx * TS + TS / 2, cy = c.ty * TS + TS / 2;
        ctx.fillStyle = "rgba(0,0,0,.25)"; ctx.beginPath(); ctx.ellipse(cx, cy + 12, 11, 4, 0, 0, 7); ctx.fill();
        drawOctocat(ctx, cx, cy, 30, c.color, time + c.tx, images[c.id]);
      }
      drawPlayer(ctx, player.x, player.y, time);
      ctx.restore();
    }
    function loop(now) {
      const dt = Math.min(0.05, (now - last) / 1000); last = now; time += dt;
      if (scene === "battle") { updateBattle(dt); if (scene === "battle") renderBattle(); else render(); }
      else { if (scene === "world" && $("inv").hidden) update(dt); render(); }
      if (toastT > 0 && scene !== "world" && (toastT -= dt) <= 0) $("toast").classList.remove("show");
      requestAnimationFrame(loop);
    }

    /* ---------- Battles ---------- */
    function startPick(foe) {
      scene = "pick"; pendingFoe = foe; keys = {}; player.moving = false;
      $("pickTitle").textContent = "Choose an Octocat to battle " + foe.name;
      const g = $("pickGrid"); g.textContent = "";
      for (const c of OCTOCATS.filter((o) => collected.has(o.id))) g.appendChild(makeCard(c, true, { showMove: true, onClick: () => startBattle(c, foe) }));
      $("pick").hidden = false; g.firstChild.focus();
    }
    function leaveEncounter(foe) {
      // step the player back from the Octocat and pause encounters briefly so they can walk away
      const fx = foe.tx * TS + TS / 2, fy = foe.ty * TS + TS / 2;
      let ux = player.x - fx, uy = player.y - fy; const n = Math.hypot(ux, uy) || 1; ux /= n; uy /= n;
      if (!ux && !uy) uy = 1;
      for (let i = 0; i < 12; i++) { const nx = player.x + ux * 4, ny = player.y + uy * 4; if (blocked(nx, ny)) break; player.x = nx; player.y = ny; }
      encounterCd = 2.5; scene = "world"; battle = null; pendingFoe = null;
      $("pick").hidden = true; $("battleUI").hidden = true; cv.focus(); Music.play("world");
    }
    function startBattle(fighter, foe) {
      scene = "battle"; $("pick").hidden = true; $("battleUI").hidden = false; $("toast").classList.remove("show"); toastT = 0;
      battle = { fighter, foe, phase: "idle", t: 0, hit: false, msg: "A wild " + foe.name + " appeared! Go, " + fighter.name + "!" };
      const m = moveOf(fighter.id);
      $("fightBtn").textContent = "Use " + m.name + " (" + m.acc + "%)";
      setBattleControls(true); $("battleMsg").textContent = battle.msg; $("fightBtn").focus(); Music.play("battle");
    }
    function setBattleControls(on) { $("fightBtn").disabled = !on; }
    function fight() {
      if (scene !== "battle" || battle.phase !== "idle") return;
      const m = moveOf(battle.fighter.id);
      battle.hit = Math.random() * 100 < m.acc; battle.phase = "attack"; battle.t = 0;
      battle.msg = battle.fighter.name + " used " + m.name + "!"; $("battleMsg").textContent = battle.msg;
      setBattleControls(false);
      const hit = battle.hit; setTimeout(() => Music.sfx(hit ? "hit" : "miss"), 380);
    }
    function runAway() {
      if (scene === "pick") leaveEncounter(pendingFoe);
      else if (scene === "battle" && battle.phase !== "ko") leaveEncounter(battle.foe);
    }
    function updateBattle(dt) {
      battle.t += dt;
      if (battle.phase === "attack" && battle.t >= 0.8) {
        battle.t = 0;
        if (battle.hit) { battle.phase = "ko"; battle.msg = battle.foe.name + " fainted!"; Music.play(null); Music.sfx("win"); }
        else { battle.phase = "miss"; battle.msg = battle.foe.name + " dodged! Try again."; }
        $("battleMsg").textContent = battle.msg;
      } else if (battle.phase === "miss" && battle.t >= 0.9) {
        battle.phase = "idle"; setBattleControls(true); $("fightBtn").focus();
      } else if (battle.phase === "ko" && battle.t >= 1.4) {
        const foe = battle.foe;
        scene = "world"; battle = null; $("battleUI").hidden = true; cv.focus(); Music.play("world");
        collect(foe);
      }
    }
    function renderBattle() {
      const c = ctx, b = battle, FX = 480, FY = 125, PX = 170, PY = 245;
      const sky = c.createLinearGradient(0, 0, 0, 140); sky.addColorStop(0, "#4f9fe0"); sky.addColorStop(1, "#ffd9a0");
      c.fillStyle = sky; c.fillRect(0, 0, VW, 140);
      c.fillStyle = "#1f6fb2"; c.fillRect(0, 100, VW, 40);
      c.strokeStyle = "#c0392b"; c.fillStyle = "#c0392b"; c.lineWidth = 3;      // Golden Gate in the distance
      c.fillRect(250, 45, 8, 80); c.fillRect(420, 45, 8, 80); c.fillRect(100, 112, 520, 5);
      c.beginPath(); c.moveTo(100, 112); c.quadraticCurveTo(175, 75, 254, 45); c.quadraticCurveTo(337, 105, 424, 45); c.quadraticCurveTo(510, 75, 620, 112); c.stroke();
      const gr = c.createLinearGradient(0, 140, 0, VH); gr.addColorStop(0, "#58b45a"); gr.addColorStop(1, "#3f8f4a");
      c.fillStyle = gr; c.fillRect(0, 140, VW, VH - 140);
      c.fillStyle = "rgba(0,0,0,.22)";
      c.beginPath(); c.ellipse(FX, FY + 52, 95, 22, 0, 0, 7); c.fill();
      c.beginPath(); c.ellipse(PX, PY + 62, 110, 26, 0, 0, 7); c.fill();

      let fx = FX, fy = FY, fa = 1, px = PX, py = PY;
      if (b.phase === "attack") {
        const p = Math.min(1, b.t / 0.8), l = Math.sin(p * Math.PI);
        px += l * (FX - PX) * 0.7; py += l * (FY - PY) * 0.7;
        if (b.hit && p > 0.5) fa = Math.sin(b.t * 50) > 0 ? 1 : 0.25;
        if (!b.hit && p > 0.5) fx += Math.sin((p - 0.5) * Math.PI * 2) * 70;
      }
      if (b.phase === "ko") { fa = Math.max(0, 1 - b.t / 1.0); fy += b.t * 40; }
      c.globalAlpha = fa; drawOctocat(c, fx, fy, 100, b.foe.color, time, images[b.foe.id]); c.globalAlpha = 1;
      drawOctocat(c, px, py, 130, b.fighter.color, time, images[b.fighter.id]);
      if (b.phase === "attack" && b.t / 0.8 > 0.45 && b.t / 0.8 < 0.85) {   // impact burst
        c.save(); c.translate(fx, fy); c.rotate(b.t * 8); c.fillStyle = b.hit ? "#ffd33d" : "#8b949e"; c.beginPath();
        for (let i = 0; i < 16; i++) { const r = i % 2 ? 22 : 46; c.lineTo(Math.cos(i * Math.PI / 8) * r, Math.sin(i * Math.PI / 8) * r); }
        c.closePath(); c.fill(); c.restore();
      }
      const box = (x, y, w, h) => { c.fillStyle = "rgba(13,17,23,.9)"; c.strokeStyle = "#58a6ff"; c.lineWidth = 2; c.beginPath(); c.roundRect(x, y, w, h, 8); c.fill(); c.stroke(); };
      c.textAlign = "left"; c.textBaseline = "alphabetic"; c.fillStyle = "#fff";
      box(16, 16, 250, 62); c.fillStyle = "#fff"; c.font = "bold 16px system-ui"; c.fillText(b.foe.name, 28, 38);
      c.font = "11px system-ui"; c.fillStyle = "#8b949e"; c.fillText("HP", 28, 60);
      c.fillStyle = "#30363d"; c.fillRect(48, 52, 200, 10);
      const hp = b.phase === "ko" ? Math.max(0, 1 - b.t / 0.5) : 1;
      c.fillStyle = "#3fb950"; c.fillRect(48, 52, 200 * hp, 10);
      c.fillStyle = "#8b949e"; c.fillText((b.phase === "ko" ? 0 : 1) + "/1", 222, 74);
      box(374, 215, 250, 52); c.fillStyle = "#fff"; c.font = "bold 16px system-ui"; c.fillText(b.fighter.name, 386, 237);
      c.font = "12px system-ui"; c.fillStyle = "#8b949e"; c.fillText("Move: " + moveOf(b.fighter.id).name, 386, 257);
    }

    /* ---------- Inventory ---------- */
    function updateCount() { $("count").textContent = collected.size; $("total").textContent = OCTOCATS.length; }
    function makeCard(c, found, opts) {
      const card = document.createElement("button");
      card.type = "button"; card.className = "card " + (found ? "found" : "locked") + (opts.selected ? " selected" : "");
      if (found) {
        const cc = document.createElement("canvas"); cc.width = cc.height = 64;
        drawOctocat(cc.getContext("2d"), 32, 30, 56, c.color, 0, images[c.id]); card.appendChild(cc);
      } else { const q = document.createElement("span"); q.className = "q"; q.textContent = "?"; card.appendChild(q); }
      const name = document.createElement("span"); name.textContent = found ? c.name : "Undiscovered"; card.appendChild(name);
      if (found && opts.showMove) { const mv = document.createElement("span"); mv.className = "mv"; mv.textContent = moveOf(c.id).name; card.appendChild(mv); }
      card.addEventListener("click", opts.onClick);
      return card;
    }
    function renderInventory() {
      const g = $("grid"); g.textContent = "";
      $("invCount").textContent = "(" + collected.size + "/" + OCTOCATS.length + ")";
      for (const c of OCTOCATS) {
        const found = collected.has(c.id);
        g.appendChild(makeCard(c, found, {
          showMove: true, selected: selected === c.id,
          onClick: () => {
            selected = c.id;
            $("detail").textContent = found ? c.name + " - " + c.where + " Move: " + moveOf(c.id).name + " (" + moveOf(c.id).acc + "% accuracy)." : "Not found yet. Keep exploring Fort Mason!";
            renderInventory();
          }
        }));
      }
    }
    function setInventory(open) {
      if (scene !== "world") return;
      $("inv").hidden = !open;
      if (open) { keys = {}; renderInventory(); $("closeInv").focus(); } else cv.focus();
    }
    $("invBtn").addEventListener("click", () => setInventory($("inv").hidden));
    $("closeInv").addEventListener("click", () => setInventory(false));
    $("fightBtn").addEventListener("click", fight);
    $("runBtn").addEventListener("click", runAway);
    $("pickRun").addEventListener("click", runAway);
    $("resetBtn").addEventListener("click", () => {
      collected = new Set(); rollMoves(); save(); selected = null; updateCount(); renderInventory();
      $("detail").textContent = "Progress reset. Go find them again!";
    });

    /* ---------- Input ---------- */
    const norm = (e) => (e.key.length === 1 ? e.key.toLowerCase() : e.key);
    const MOVE_KEYS = new Set(["w", "a", "s", "d", "ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight"]);
    addEventListener("keydown", (e) => {
      const k = norm(e);
      if (e.ctrlKey || e.metaKey || e.altKey) return;
      if (k === "m") { Music.toggleMute(); return; }
      if (scene === "battle" || scene === "pick") {
        if (k === "Escape") runAway();
        else if (scene === "battle" && (k === "f" || k === "1")) fight();
        return;
      }
      if (k === "i") { setInventory($("inv").hidden); return; }
      if (k === "Escape" && !$("inv").hidden) { setInventory(false); return; }
      if (MOVE_KEYS.has(k) && $("inv").hidden) { keys[k] = true; e.preventDefault(); }
    });
    addEventListener("keyup", (e) => { keys[norm(e)] = false; });
    addEventListener("blur", () => { keys = {}; });
    cv.addEventListener("pointerdown", () => cv.focus());

    updateCount(); renderInventory();
    requestAnimationFrame((t) => { last = t; loop(t); });
  </script>
</body>
