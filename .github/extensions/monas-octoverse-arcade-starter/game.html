<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mona's Octoverse Arcade starter</title>
  <link rel="icon" href="data:,">
  <style>
    :root {
      color-scheme: dark;
      font: 16px/1.5 system-ui, sans-serif;
      background: #0d1117;
      color: #e6edf3;
    }

    * { box-sizing: border-box; }
    body { display: grid; min-height: 100vh; margin: 0; place-items: center; padding: 1.5rem; }
    main { width: min(100%, 34rem); padding: 2rem; background: #161b22; border: 1px solid #30363d; border-radius: 1rem; }
    .eyebrow { color: #3fb950; font-size: 0.8rem; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; }
    h1 { margin: 0.5rem 0; font-size: clamp(1.7rem, 7vw, 2.5rem); line-height: 1.1; }
    p { color: #c9d1d9; }
    button { padding: 0.7rem 1rem; color: #fff; font: inherit; font-weight: 700; background: #238636; border: 0; border-radius: 0.5rem; cursor: pointer; }
    button:hover { background: #1a7f37; }
    button:focus-visible { outline: 3px solid #58a6ff; outline-offset: 3px; }
    #status { min-height: 1.5em; margin-bottom: 0; }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">Canvas starter</p>
    <h1>Mona's Octoverse Arcade</h1>
    <p>Your canvas is running. This welcome screen is the starting point—not the finished game.</p>
    <button id="ready" type="button">Check the canvas</button>
    <p id="status" role="status" aria-live="polite"></p>
  </main>
  <script>
    document.querySelector("#ready").addEventListener("click", () => {
      document.querySelector("#status").textContent = "Canvas is interactive. Start building the game in game.html!";
    });
  </script>
</body>
</html>
